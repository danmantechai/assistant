  play_music:
    tool: play_music
    slots: music_query
    group: music
    strip: ['\bplay\b', '\bput on\b', '\bqueue up\b', "\\blet'?s (hear|listen to)\\b", '\bi want to (hear|listen to)\b',
            "\\bi'?d like to (hear|listen to)\\b", '\blisten to\b', '\bspin\b', '\bon spotify\b', '\bfrom spotify\b',
            '\bfor me\b', '\bme\b', '\bus\b', '\bsome\b', '\ba bit of\b', '\bsongs by\b', '\bmusic by\b',
            '\bplease\b']
