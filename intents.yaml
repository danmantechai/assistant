  open_website:
    tool: web
    slots: site
    group: open
    strip: ['\bopen( up)?\b', '\bgo to\b', '\bvisit\b', '\btake me to\b', '\bnavigate to\b', '\bbring up\b',
            '\bload\b', '\bpull up\b', '\bshow me\b', '\bthe\b', '\bwebsite\b', '\bsite\b', '\bweb page\b',
            '\bpage\b', '\bin (the|my) browser\b', '\bfor me\b', '\bmy\b']
    examples:
      - open youtube
      - go to gmail
      - open github.com
      - take me to reddit
      - visit wikipedia
