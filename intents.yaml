# Semantic router intents. The router embeds every example once (cached in data/router_cache.npz,
# re-embedded only when this file changes) and matches requests by meaning, so paraphrases work.
#
# Per intent:
#   tool      tool to run directly (none = the router answers itself, e.g. time_date)
#   slots     which slot extractor fills the tool's arguments (see mary/router/slots.py)
#   group     intents whose confusion doesn't matter because the slot step tells them apart
#             (e.g. "open youtube" vs "open spotify"): margin is measured against other groups
#   strip     regexes removed before slot extraction ("open", "fire up", "get ... going")
#   llm_if    regex: if it matches, the request goes to the LLM even when the intent is clear
#   lead      regex on the request's first words that picks the intent without the score test
#             ("remember …": the free text after it would otherwise decide the match)
#   replies   spoken templates ({say} = the tool's own reply; slot names also work)
#   examples  10-20 varied ways of asking

intents:
  open_app:
    tool: open_app
    slots: app
    group: open
    strip: ['\bopen( up)?\b', '\blaunch\b', '\bstart( up)?\b', '\bfire up\b', '\brun\b', '\bbring up\b',
            '\bload( up)?\b', '\bboot( up)?\b', '\bpull up\b', '\bget\b', '\bgoing\b', '\bapp\b',
            '\bapplication\b', '\bprogram\b', '\bfor me\b', '\bi need\b', '\bthe\b', '\bmy\b']
    replies: ['{say}', 'Opening {app}.', '{app}, coming up.']
    examples:
      - open spotify
      - launch chrome
      - fire up vs code
      - can you start discord
      - get notepad going
      - open the calculator
      - start word
      - bring up file explorer
      - run task manager
      - open my browser
      - launch the settings app
      - pull up excel
      - open up teams
      - load paint for me
      - I need the terminal
      - boot up steam
      - launch microsoft word
      - open google chrome
      - get discord running

  close_app:
    tool: close_app
    slots: running_app
    strip: ['\bclose( down)?\b', '\bquit\b', '\bexit\b', '\bkill\b', '\bshut( down)?\b', '\bterminate\b',
            '\bget rid of\b', '\bout of\b', '\bapp\b', '\bwindow\b', '\bprogram\b', '\bthe\b', '\bmy\b',
            '\bfor me\b', '\bplease\b']
    llm_if: '\b(all|every|everything|other)\b'
    examples:
