      - locate my CV
      - find the presentation from last week
      - where did I save the invoice
      - find the word document about the project
      - search my documents for the contract
      - find my recent downloads
      - find the zip file I downloaded
      - where are my screenshots
      - what's in my downloads folder
      - list the files in my downloads
      - show me what I downloaded today
      - give me a list of images in my downloads folder
      - check if I have any new files downloaded today
      - do I have any PDFs in my documents
      - what did I download this week
      - any new files on my desktop
      - show me the files on my desktop
      - files in my downloads folder

  weather:
    tool: check_weather
    slots: weather
    group: lookup     # "google the weather in Paris" is a web search: the slot step tells them apart
    examples:
      - what's the weather
      - what is the current weather
      - how's the weather today
      - what's the weather like outside
      - is it raining
      - is it going to rain today
      - how hot is it outside
      - what's the temperature outside
      - weather in Paris
      - what's the weather like tomorrow
      - do I need an umbrella today
      - how cold is it
      - check the weather
      - weather please

  # Acting on what's on screen, in any app: "click subscribe", "press the play button", "pick the one
  # where it says …". Keys ("press enter") go to the LLM, which uses the keyboard tool.
  click:
    tool: screen
    slots: click
    lead: '^(click|tap|press|hit|select|choose|pick)\b'
    examples: []

  scroll:
    tool: screen
    slots: scroll
    lead: '^(scroll|page (up|down)$|go (up|down)( a bit| a little)?$|(go|scroll) to the (top|bottom)\b)'
    examples: []

  # "open my downloads folder": File Explorer on that folder. ("Show me my downloads" lists the files.)
  open_folder:
    tool: file_action
    slots: folder
    lead: '^(open|go to|take me to|bring up|pull up)\s+(up\s+)?(my |the )?((downloads?|documents|desktop)( folder)?|(pictures|photos|music|videos) folder)\s*$'
    examples: []    # chosen by `lead` only, so it never competes with other intents on similarity

  # Right after a file search: "open the newest one", "open it", "play the video". The slot step
  # checks there was a search in the last 15 minutes; otherwise the request goes to the LLM.
  open_found:
    tool: file_action
    slots: found_file
    lead: '^(open|play|show( me)?|view|watch|launch|start|run)\s+(it|that|this|(the |that |this )?(first|second|third|fourth|fifth|newest|latest|most recent|oldest|top|last|1st|2nd|3rd|4th|5th)( one| file| \w+)?|number \w+|(the |that |this )(file|one|video|pdf|picture|photo|image|document|song|spreadsheet|presentation|zip|recording|clip|movie)s?)\s*$'
    examples: []    # chosen by `lead` only, so it never competes with other intents on similarity

  type_text:
    tool: keyboard
    slots: dictation
    lead: '^(type|write|dictate)\b'   # typing always starts like this; the words after it can be anything
    # Dictated words make similarity lower than for fixed commands; the slot step only accepts
    # requests that start with type/write, which makes the lower bar safe.
    direct_score: 0.70
    # "write me a poem" is composing (the LLM's job), not typing what was said.
    llm_if: '\b(password|email address|my address|phone number|translate|summari[sz]e|reply)\b|\bwrite (me |us )?(a|an|some|my) (poem|story|e-?mail|letter|essay|song|message|summary|paragraph|speech|joke|response|note|list)\b'
    examples:
      - type hello world
      - write the following text
      - write the following text in it
      - "type this: see you at five"
      - write happy birthday in it
      - write Daniel is a good boy
      - type thank you very much
      - "put this text in: the meeting moved to Monday"
      - type out good morning everyone
      - write down call the bank tomorrow
      - type the following
      - write this down for me
      - enter the text dear sir

  remember:
    tool: memory
    slots: remember
    lead: '^(remember|keep in mind|make a note that|note that)\b'
    # Questions ("do you remember…?") and reminders ("remember to call mum") aren't facts to keep.
    llm_if: '\?\s*$|^\W*(do|did|what|when|where|can) you\b|\bremember (to|when|what|how|if|whether|who|where)\b'
    examples:
      - remember that I prefer tea to coffee
      - please remember my sister's name is Ama
      - remember I wake up at six
      - remember my car is a Toyota
      - "remember this: the spare key is in the drawer"
      - remember that my birthday is the fifth of May
      - keep in mind that I work from home on Fridays
      - remember my doctor is called Dr Mensah

  forget:
    tool: memory
    slots: forget
    lead: '^(forget|stop remembering)\b'
    examples:
      - forget that I prefer tea
      - forget what I said about my car
      - stop remembering my birthday
      - forget about the spare key

  my_name:
    tool: memory
    slots: name
    lead: '^(my name is|my name''s|(you can )?call me|i''m called|i am called)\b'
    llm_if: '\bcall me (a|an|the|when|later|back|tomorrow|tonight|if|on|at|in)\b'
    examples:
