      - go to bbc.co.uk
      - open facebook

  web_search:
    tool: web
    slots: search_query
    group: lookup
    # Search topics are arbitrary, so similarity stays lower than for fixed commands. The slot step
    # only accepts requests that start with a search verb, which makes the lower bar safe.
    direct_score: 0.72
    strip: ['\bsearch( the web| google| online| the internet)?( for)?\b', '\bgoogle\b', '\blook up\b',
            '\bfind (me )?(information|info|stuff) (on|about)\b', '\bweb search( for)?\b',
            '\bdo a search (for|on)\b', '\bsearch up\b', '\bon (the web|google|the internet)\b', '\bfor me\b',
            '^\W*(find|look for|get me)\b']
    examples:
      - search for chicken curry recipes
      - google how to tie a tie
      - look up the weather in Lisbon
      - search the web for cheap flights to London
      - find information about black holes
      - search online for python tutorials
      - do a search for best laptops 2026
      - google premier league table
      - look up the meaning of serendipity
      - search for news about Ghana
      - web search electric cars
      - search up how to make fufu
      - search for cheap hotels in Lisbon
      - google best phones under 300 dollars
      - look up how far away the moon is
      - search for jobs near me
      - search youtube for cooking videos
      - find funny cat videos on youtube
      - look up MrBeast on YouTube
      - search youtube for Don Williams songs
      - find a video about fixing a bike on youtube

  find_files:
    tool: find_files
    slots: files
    strip: ['\bfind\b', '\blook for\b', '\blocate\b', '\bsearch (my|for|through)\b', '\bwhere (is|are|did i (save|put))\b',
            '\bshow me\b', '\bget me\b', '\bthe\b', '\bmy\b', '\ba\b', '\ban\b', '\bfiles?\b', '\bfolder\b',
            '\bi (downloaded|saved|made|created|got|received|wrote)\b', '\bthat\b', '\bwhich\b', '\bcalled\b',
            '\bnamed\b', '\babout\b', '\bfrom\b', '\bin\b', '\bon\b', '\bfor me\b']
