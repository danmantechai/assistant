name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Nothing private in the repo
        run: python -m mary.release_check
      - name: Tests (on the shipped defaults; ones needing downloaded models or a microphone skip)
        run: python -m pytest -q
