# From the 26 Oct transcript: she played music for "Try", web-searched a personal file, and glued the search
# words into "bank statements containing bank statements". Later replays read the PDF with PowerShell (Get-Content);
# now read_document reads it, and successive calls read on through it (each result is what the brick gives for the
# call its last note names).
name: Bank statement
